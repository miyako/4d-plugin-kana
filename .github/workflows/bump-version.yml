name: Bump version

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: Semantic version bump (source only)
        options:
          - patch
          - minor
          - major
        default: patch
        required: true

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: bump selected branch source metadata only
        env:
          SELECTED_SHA: ${{ github.sha }}
          SELECTED_BRANCH: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          test "$REF_TYPE" = branch
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 .github/scripts/release.py bump --sha "$SELECTED_SHA" --branch "$SELECTED_BRANCH" --mode "$MODE"

      - name: summary
        run: echo "Source version bumped. Run Build manually on the selected branch to publish it." >> "$GITHUB_STEP_SUMMARY"
